<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Book</title>
</head>
<body>
    {% if deleted %}
        <h1>Book deleted</h1>
        <p>The book <strong>{{ books.name_b }}</strong> has been removed.</p>
        <a href="{% url 'list_books' %}">Back to list</a>
    {% else %}
        <h1>Delete book?</h1>
        <p>Are you sure you want to delete <strong>{{ books.name_b }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirm delete</button>
        </form>
        <a href="{% url 'list_books' %}">Cancel</a>
    {% endif %}
</body>
</html>
