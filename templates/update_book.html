<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Book</title>
</head>
<body>
    <h1>Edit Book</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name_b">Name</label><br>
        <input id="name_b" type="text" name="name_b" value="{{ books.name_b }}" required><br><br>

        <label for="after_b">Author</label><br>
        <input id="after_b" type="text" name="after_b" value="{{ books.after_b }}" required><br><br>

        <label for="caption">Caption</label><br>
        <input id="caption" type="number" name="caption" value="{{ books.caption }}" required><br><br>

        <button type="submit">Update</button>
    </form>
    <a href="{% url 'list_books' %}">Back to list</a>
</body>
</html>
