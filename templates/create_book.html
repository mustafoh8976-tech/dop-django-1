<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Book</title>
</head>
<body>
    <h1>Create Book</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name_b">Name</label><br>
        <input id="name_b" type="text" name="name_b" required><br><br>

        <label for="after_b">Author</label><br>
        <input id="after_b" type="text" name="after_b" required><br><br>

        <label for="caption">Caption</label><br>
        <input id="caption" type="number" name="caption" required><br><br>

        <button type="submit">Save</button>
    </form>
    <a href="{% url 'list_books' %}">Back to list</a>
</body>
</html>
